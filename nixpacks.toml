[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs-18_x"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts",
    "npm cache clean --force || true",
    "npm install --prefer-offline --no-audit --legacy-peer-deps",
    "npm run build"
]

[phases.build]
cmds = [
    "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache",
    "chmod -R 775 storage bootstrap/cache",
    "cp php.ini /etc/php/php.ini || cp php.ini /usr/local/etc/php/php.ini || echo 'Note: php.ini may need to be configured manually'"
]

[start]
cmd = "sh -c 'php -d upload_max_filesize=10M -d post_max_size=12M -d max_execution_time=300 -d max_input_time=300 artisan migrate --force && (php artisan admin:setup-from-env || true) && php -d upload_max_filesize=10M -d post_max_size=12M -d max_execution_time=300 -d max_input_time=300 artisan serve --host=0.0.0.0 --port=$PORT'"
